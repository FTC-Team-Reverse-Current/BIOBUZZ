repositories {
    mavenCentral()
    google() // Needed for androidx

    // 3rd Party
    maven { url = 'https://repo.dairy.foundation/releases/'}
    maven { url = "https://repo.dairy.foundation/snapshots" }
    maven { url = "https://mymaven.bylazar.com/releases" }
}

dependencies {
    // Base FTC
    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'

    // Pedro Pathing
    implementation 'com.pedropathing:revhub:3.0.0'
    implementation 'com.pedropathing:tuning:1.0.0'
    implementation 'com.pedropathing.ivy:pedro:1.1.1'

    // NextFTC
    implementation 'dev.nextftc.v2:control:0.2.1'
    implementation 'dev.nextftc.v2:hardware:0.2.1'
    implementation 'dev.nextftc.v2:robot:0.2.1'

    //Panels
    implementation "com.bylazar:battery:1.0.3"
    implementation "com.bylazar:camerastream:1.0.0"
    implementation "com.bylazar:capture:1.0.3"
    implementation "com.bylazar:configurables:1.0.5"
    implementation "com.bylazar:field:1.0.7"
    implementation "com.bylazar:fullpanels:1.0.13"
    implementation "com.bylazar:gamepad:1.0.4"
    implementation "com.bylazar:graph:1.0.4"
    implementation "com.bylazar:lights:1.0.3"
    implementation "com.bylazar:limelightproxy:1.0.4"
    implementation "com.bylazar:opmodecontrol:1.0.3"
    implementation "com.bylazar:pinger:1.0.3"
    implementation "com.bylazar:telemetry:1.0.5"
    implementation "com.bylazar:themes:1.0.3"
    implementation "com.bylazar:utils:1.0.4"

    //Sloth
    implementation("dev.frozenmilk.sinister:Sloth:0.3.0")
    implementation("com.bylazar.sloth:fullpanels:0.3.2+1.0.13")
}

